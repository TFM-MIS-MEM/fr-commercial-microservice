repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        # Los pesos de los modelos se versionan a propósito (checkpoints/README.md).
        exclude: ^checkpoints/

  # Mismas herramientas y versiones que la CI: las del entorno, fijadas en
  # requirements-dev.txt, y no una copia aparte con su propio `rev` que envejece.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check src tests
        language: system
        pass_filenames: false
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: ruff format --check src tests
        language: system
        pass_filenames: false
        types: [python]
      - id: bandit
        name: bandit
        entry: bandit -q -c pyproject.toml -r src
        language: system
        pass_filenames: false
        types: [python]
      # En el contenedor de desarrollo, como `make test`: torch `+cpu` no existe
      # para macOS.
      - id: pytest
        name: pytest
        entry: make test
        language: system
        pass_filenames: false
        always_run: true
