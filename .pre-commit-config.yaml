repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # Mismas herramientas y versiones que la CI: las del entorno, fijadas en
  # requirements-dev.txt, y no una copia aparte con su propio `rev` que envejece.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check src tests
        language: system
        pass_filenames: false
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: ruff format --check src tests
        language: system
        pass_filenames: false
        types: [python]
      - id: bandit
        name: bandit
        entry: bandit -q -c pyproject.toml -r src
        language: system
        pass_filenames: false
        types: [python]
      # Necesita TEST_MONGODB_URI: véase .env.example.
      - id: pytest
        name: pytest
        entry: pytest
        language: system
        pass_filenames: false
        always_run: true
