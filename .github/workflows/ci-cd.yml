name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, Audit & Test
    runs-on: ubuntu-latest

    # MongoDB real para las pruebas, la misma imagen que los composes.
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          # La misma que construye el Dockerfile.
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Desde los ficheros fijados y con resúmenes: la CI prueba el mismo árbol
      # que despliega la imagen.
      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt

      - name: Lint with Ruff
        run: ruff check src tests

      - name: Format check with Ruff
        run: ruff format --check src tests

      - name: Static analysis with Bandit
        run: bandit -q -c pyproject.toml -r src

      # -----------------------------------------------
      # Auditoría de dependencias: el equivalente de `pnpm audit --prod`.
      # -----------------------------------------------
      # Solo requirements.txt, que es lo que instala la imagen. Las herramientas
      # de desarrollo no llegan a producción, y un aviso sobre código que no se
      # ejecuta allí es lo que dejó en rojo permanente el paso de `auth` hasta
      # que nadie leía su salida.
      #
      # El reintento es por el servicio de avisos, no por las dependencias:
      # `pip-audit` sale con 1 tanto si encuentra avisos como si no consigue
      # hablar con PyPI (medido en #33: `ConnectionError`, exit=1). Solo lo
      # segundo se reintenta: un aviso real tiene que teñir la CI de rojo a la
      # primera. Mismo mecanismo que auth.
      - name: Security audit (production tree)
        run: |
          for intento in 1 2 3; do
            if pip-audit -r requirements.txt --require-hashes --disable-pip --progress-spinner off; then
              exit 0
            fi
            if ! curl -sf --max-time 20 -o /dev/null https://pypi.org/pypi/pip/json; then
              echo "::warning::PyPI no responde (intento $intento/3); reintentando en 30 s"
              sleep 30
              continue
            fi
            echo "::error::pip-audit ha encontrado vulnerabilidades en el árbol de producción"
            exit 1
          done
          echo "::error::PyPI no ha respondido tras 3 intentos"
          exit 1

      # El paso anterior NO audita torch ni torchvision, y sale con 0: pip-audit
      # consulta PyPI, donde `2.14.1+cpu` y `0.29.1+cpu` no existen, y los salta
      # con «Dependency not found on PyPI» (medido en #37). Se auditan aquí por su
      # versión sin la etiqueta local, que es el mismo código publicado en PyPI.
      # Medido: limpio con torch 2.14.1; el control con 2.5.1 da 22 avisos.
      - name: Security audit (torch y torchvision, sin la etiqueta +cpu)
        run: |
          grep -E '^(torch|torchvision)==' requirements.txt | sed -E 's/\+cpu.*//' > /tmp/torch-audit.txt
          cat /tmp/torch-audit.txt
          test "$(wc -l < /tmp/torch-audit.txt)" -eq 2
          for intento in 1 2 3; do
            if pip-audit -r /tmp/torch-audit.txt --no-deps --disable-pip --progress-spinner off; then
              exit 0
            fi
            if ! curl -sf --max-time 20 -o /dev/null https://pypi.org/pypi/pip/json; then
              echo "::warning::PyPI no responde (intento $intento/3); reintentando en 30 s"
              sleep 30
              continue
            fi
            echo "::error::pip-audit ha encontrado vulnerabilidades en torch o torchvision"
            exit 1
          done
          echo "::error::PyPI no ha respondido tras 3 intentos"
          exit 1

      - name: Run tests with coverage
        env:
          TEST_MONGODB_URI: mongodb://localhost:27017
        run: pytest

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7
