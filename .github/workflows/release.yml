name: Release & Docker Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/python-microservice-template

jobs:
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract tag name
        id: tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ steps.tag.outputs.VERSION }}
            ${{ env.DOCKER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract tag name
        id: tag
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "VERSION=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: notes
        run: |
          TAG_NAME="${{ steps.tag.outputs.VERSION }}"
          PREV_TAG=$(git describe --tags --abbrev=0 "$TAG_NAME^" 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"%H")
          else
            COMMITS=$(git log --pretty=format:"%H" "$PREV_TAG..$TAG_NAME")
          fi

          FEATURES=""
          FIXES=""
          OTHER=""

          for sha in $COMMITS; do
            MSG=$(git log -1 --pretty=format:"%s" $sha)
            if [[ "$MSG" =~ ^(feat): ]]; then
              FEATURES+="- ${MSG#*: }\n"
            elif [[ "$MSG" =~ ^(fix): ]]; then
              FIXES+="- ${MSG#*: }\n"
            else
              OTHER+="- $MSG\n"
            fi
          done

          RELEASE_NOTES="# Release $TAG_NAME\n\n"
          RELEASE_NOTES+="## 🚀 Features\n${FEATURES:-No new features.}\n\n"
          RELEASE_NOTES+="## 🐛 Fixes\n${FIXES:-No fixes.}\n\n"
          RELEASE_NOTES+="## 🔧 Other\n${OTHER:-No other changes.}\n"

          echo -e "$RELEASE_NOTES" > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.VERSION }}
          name: Release ${{ steps.tag.outputs.VERSION }}
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
