[project]
name = "python-template"
version = "0.1.0"
description = "FastAPI Base Template for AI Microservices"
readme = "README.md"
requires-python = ">=3.11"

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    ".github",
    "__pycache__",
    "build",
    "dist",
    "venv",
    ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C", "B"]
ignore = []

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=src --cov-report=term-missing --cov-report=xml"
testpaths = [
    "tests",
]
pythonpath = ["."]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]
