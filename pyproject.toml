[project]
name = "fr-commercial-microservice"
version = "0.1.0"
description = "Galerías, identidades, rostros e inferencia — TFM SaaS de reconocimiento facial"
readme = "README.md"
requires-python = ">=3.11,<3.12"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", ".github", "__pycache__", "build", "dist", "venv", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C", "B"]
ignore = [
    # `Depends(...)` en los valores por omisión es el idioma de FastAPI.
    "B008",
]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-ra -q --strict-markers --cov=src --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.report]
# Trinquete: 98,21 % medido en F1 (#33), fijado al entero inferior para que no
# salte por dos centésimas en un refactor. Solo sube.
fail_under = 98

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]
